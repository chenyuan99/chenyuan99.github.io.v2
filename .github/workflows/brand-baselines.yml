name: Update intentional brand baselines
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'brand-cy-wordmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-cy-wordmark
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Commit intentional screenshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh visual baselines for personal identity"
            git push origin HEAD:refs/heads/brand-cy-wordmark
          fi
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branded-preview-review
          path: |
            tests/e2e/__screenshots__/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
