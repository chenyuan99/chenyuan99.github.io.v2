name: Portfolio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build static site
        id: build_site
        run: npm run build
      - run: npm test
      - run: npm run test:budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Run Lighthouse budgets
        if: ${{ !cancelled() && steps.build_site.outcome == 'success' }}
        run: npm run test:lighthouse
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-quality-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
            artifacts/lighthouse/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
