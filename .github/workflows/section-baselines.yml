name: Update unnumbered section baselines
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'remove-section-numbers'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remove-section-numbers
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Commit intentional screenshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh screenshots without decorative numbering"
            git push origin HEAD:refs/heads/remove-section-numbers
          fi
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unnumbered-section-preview
          path: |
            tests/e2e/__screenshots__/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
